[tool.poetry]
name = "bank-transaction-analysis"
version = "0.1.0"
description = "Анализ банковских транзакций с веб-интерфейсом и отчетами"
authors = ["Victor <Nechaevvictor199220@gmail.com>"]
license = "MIT"
readme = "README.md"

packages = [
    {include = "bank_transaction_analysis", from = "."},
    {include = "src", from = "."}
]

[tool.poetry.dependencies]
python = "^3.13"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.9.0"
isort = "^7.0.0"

[tool.black]
line-length = 119
exclude = '''
/(
  \.git
  \.venv
)/
'''

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
namespace_packages = true
exclude = [
    'venv/',
    '\\.venv/',
    'build/',
    'dist/',
    '__pycache__/'
]

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
